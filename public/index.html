<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅游小助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50:  '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            },
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">

  <!-- ========== 顶部导航栏 ========== -->
  <nav class="sticky top-0 z-50 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center gap-2 cursor-pointer" onclick="navigateTo('home')">
        <span class="text-2xl">✈️</span>
        <span class="text-lg font-bold bg-gradient-to-r from-blue-500 to-cyan-400 bg-clip-text text-transparent">
          旅游小助手
        </span>
      </div>

      <!-- 桌面端导航 -->
      <div class="hidden md:flex items-center gap-1">
        <button class="nav-btn active" data-page="home">首页</button>
        <button class="nav-btn" data-page="teams">小分队</button>
        <button class="nav-btn" data-page="aa">AA 记账</button>
        <button class="nav-btn" data-page="game">在线桌游</button>
      </div>

      <!-- 右侧操作 -->
      <div class="flex items-center gap-2">
        <!-- 主题切换 -->
        <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" title="切换主题">
          <span id="themeIcon" class="text-xl">🌙</span>
        </button>
        <!-- 用户头像/登录 -->
        <button id="userAvatarBtn" class="user-avatar-btn" title="个人中心">
          <span class="text-xl">👤</span>
        </button>
        <!-- 移动端菜单按钮 -->
        <button id="menuToggle" class="md:hidden p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
          <span class="text-xl">☰</span>
        </button>
      </div>
    </div>

    <!-- 移动端下拉菜单 -->
    <div id="mobileMenu" class="hidden md:hidden border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
      <div class="px-4 py-2 space-y-1">
        <button class="mobile-nav-btn active" data-page="home">🏠 首页</button>
        <button class="mobile-nav-btn" data-page="teams">👥 小分队</button>
        <button class="mobile-nav-btn" data-page="aa">💰 AA 记账</button>
        <button class="mobile-nav-btn" data-page="game">🎲 在线桌游</button>
      </div>
    </div>
  </nav>

  <!-- ========== 登录模态框 ========== -->
  <div id="loginModal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content max-w-sm">
      <div class="text-center">
        <div class="text-5xl mb-3">✈️</div>
        <h2 class="text-xl font-bold mb-1">欢迎来到旅游小助手</h2>
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">登录后即可创建和加入旅游小分队</p>

        <!-- 设置昵称 -->
        <div class="mb-4">
          <input id="loginNickname" type="text" placeholder="输入你的昵称" maxlength="20"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600
                   bg-white dark:bg-gray-700 text-center text-lg focus:outline-none
                   focus:ring-2 focus:ring-primary-400 focus:border-transparent transition">
        </div>

        <!-- 选择头像 -->
        <div class="mb-6">
          <p class="text-sm text-gray-500 dark:text-gray-400 mb-3">选择一个头像</p>
          <div id="avatarPicker" class="flex flex-wrap justify-center gap-3">
            <!-- 头像选项由 JS 生成 -->
          </div>
        </div>

        <button id="loginBtn" class="w-full py-3 rounded-lg bg-primary-600 hover:bg-primary-700
          text-white font-bold text-base transition-colors">
          登录
        </button>
      </div>
    </div>
  </div>

  <!-- ========== 创建小分队模态框 ========== -->
  <div id="createTeamModal" class="modal hidden">
    <div class="modal-backdrop" onclick="closeCreateTeamModal()"></div>
    <div class="modal-content max-w-md">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-lg font-bold">创建旅游小分队</h2>
        <button onclick="closeCreateTeamModal()" class="p-1 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-400 text-xl">&times;</button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">小分队名称 <span class="text-red-500">*</span></label>
          <input id="teamName" type="text" placeholder="例：三亚欢乐游" maxlength="30"
            class="form-input">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">目的地</label>
          <input id="teamDest" type="text" placeholder="例：海南三亚" maxlength="50"
            class="form-input">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">出发日期</label>
            <input id="teamStartDate" type="date" class="form-input">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">返回日期</label>
            <input id="teamEndDate" type="date" class="form-input">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">描述</label>
          <textarea id="teamDesc" rows="3" placeholder="描述一下这次旅行…" maxlength="200"
            class="form-input resize-none"></textarea>
        </div>
      </div>

      <div class="flex gap-3 mt-6">
        <button onclick="closeCreateTeamModal()" class="flex-1 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
          取消
        </button>
        <button onclick="createTeam()" class="flex-1 py-2.5 rounded-lg bg-primary-600 hover:bg-primary-700 text-white font-medium transition-colors">
          创建
        </button>
      </div>
    </div>
  </div>

  <!-- ========== 加入小分队模态框 ========== -->
  <div id="joinTeamModal" class="modal hidden">
    <div class="modal-backdrop" onclick="closeJoinTeamModal()"></div>
    <div class="modal-content max-w-sm">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-lg font-bold">加入小分队</h2>
        <button onclick="closeJoinTeamModal()" class="p-1 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-400 text-xl">&times;</button>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">输入邀请码</label>
        <input id="joinCode" type="text" placeholder="请输入6位邀请码" maxlength="6"
          class="form-input text-center text-2xl tracking-[0.5em] uppercase">
      </div>

      <div class="flex gap-3 mt-6">
        <button onclick="closeJoinTeamModal()" class="flex-1 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
          取消
        </button>
        <button onclick="joinTeam()" class="flex-1 py-2.5 rounded-lg bg-primary-600 hover:bg-primary-700 text-white font-medium transition-colors">
          加入
        </button>
      </div>
    </div>
  </div>

  <!-- ========== 编辑资料模态框 ========== -->
  <div id="editProfileModal" class="modal hidden">
    <div class="modal-backdrop" onclick="closeEditProfileModal()"></div>
    <div class="modal-content max-w-sm">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-lg font-bold">编辑资料</h2>
        <button onclick="closeEditProfileModal()" class="p-1 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-400 text-xl">&times;</button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">头像</label>
          <div id="editAvatarPicker" class="flex flex-wrap gap-3">
            <!-- 由 JS 生成 -->
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">昵称</label>
          <input id="editNickname" type="text" placeholder="输入昵称" maxlength="20" class="form-input">
        </div>
      </div>

      <div class="flex gap-3 mt-6">
        <button onclick="closeEditProfileModal()" class="flex-1 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
          取消
        </button>
        <button onclick="saveProfile()" class="flex-1 py-2.5 rounded-lg bg-primary-600 hover:bg-primary-700 text-white font-medium transition-colors">
          保存
        </button>
      </div>
    </div>
  </div>

  <!-- ========== 页面内容区 ========== -->
  <main class="max-w-5xl mx-auto px-4 py-6">

    <!-- 首页 -->
    <section id="page-home" class="page">
      <!-- 欢迎横幅 -->
      <div class="rounded-2xl bg-gradient-to-br from-blue-500 to-cyan-400 p-6 md:p-8 text-white mb-8">
        <h1 class="text-2xl md:text-3xl font-bold mb-2">旅途好帮手 ✈️</h1>
        <p class="text-blue-100 text-sm md:text-base">记账、桌游，一个应用全搞定</p>
      </div>

      <!-- 功能卡片 -->
      <h2 class="text-lg font-semibold mb-4 text-gray-700 dark:text-gray-300">功能一览</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">

        <button class="feature-card" data-page="teams">
          <div class="flex items-start gap-4">
            <span class="text-4xl">👥</span>
            <div class="text-left">
              <h3 class="font-bold text-lg">旅游小分队</h3>
              <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                创建或加入旅游小分队，和小伙伴一起出发
              </p>
            </div>
          </div>
        </button>

        <button class="feature-card" data-page="aa">
          <div class="flex items-start gap-4">
            <span class="text-4xl">💰</span>
            <div class="text-left">
              <h3 class="font-bold text-lg">AA 分摊计算器</h3>
              <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                记录旅行开销，自动计算最优还款方案，谁也不用多付一分钱
              </p>
            </div>
          </div>
        </button>

        <button class="feature-card" data-page="game">
          <div class="flex items-start gap-4">
            <span class="text-4xl">🎲</span>
            <div class="text-left">
              <h3 class="font-bold text-lg">在线桌游</h3>
              <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                旅途无聊？来一局谁是卧底、你画我猜，手机就是游戏机
              </p>
            </div>
          </div>
        </button>

        <button class="feature-card opacity-50 cursor-not-allowed" disabled>
          <div class="flex items-start gap-4">
            <span class="text-4xl">📸</span>
            <div class="text-left">
              <h3 class="font-bold text-lg">旅行相册</h3>
              <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">即将上线…</p>
            </div>
          </div>
        </button>

      </div>
    </section>

    <!-- ========== 小分队列表页 ========== -->
    <section id="page-teams" class="page hidden">
      <div class="flex items-center gap-3 mb-6">
        <button class="back-btn md:hidden" data-page="home">←</button>
        <h1 class="text-2xl font-bold">👥 旅游小分队</h1>
      </div>

      <!-- 未登录提示 -->
      <div id="teamsLoginPrompt" class="hidden">
        <div class="placeholder-card">
          <span class="text-5xl mb-4">🔒</span>
          <p class="text-gray-500 dark:text-gray-400 text-lg font-medium">请先登录</p>
          <p class="text-gray-400 dark:text-gray-500 text-sm mt-1 mb-4">登录后即可创建和加入旅游小分队</p>
          <button onclick="showLoginModal()" class="px-6 py-2 rounded-lg bg-primary-600 hover:bg-primary-700 text-white font-medium transition-colors">
            登录
          </button>
        </div>
      </div>

      <!-- 已登录内容 -->
      <div id="teamsContent" class="hidden">
        <!-- 操作按钮 -->
        <div class="flex gap-3 mb-6">
          <button onclick="showCreateTeamModal()" class="flex-1 py-3 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-medium flex items-center justify-center gap-2 transition-colors">
            <span class="text-lg">+</span> 创建小分队
          </button>
          <button onclick="showJoinTeamModal()" class="flex-1 py-3 rounded-xl border-2 border-primary-600 text-primary-600 dark:text-primary-400 dark:border-primary-400 hover:bg-primary-50 dark:hover:bg-primary-900/20 font-medium flex items-center justify-center gap-2 transition-colors">
            🔗 加入小分队
          </button>
        </div>

        <!-- 我的小分队列表 -->
        <h2 class="text-base font-semibold text-gray-600 dark:text-gray-400 mb-3">我的小分队</h2>
        <div id="teamsList">
          <!-- 由 JS 动态生成 -->
        </div>
        <div id="emptyTeams" class="hidden">
          <div class="placeholder-card">
            <span class="text-5xl mb-4">🗺️</span>
            <p class="text-gray-400 dark:text-gray-500 text-lg">还没有小分队</p>
            <p class="text-gray-400 dark:text-gray-500 text-sm mt-1">创建一个小分队，邀请小伙伴一起出发吧！</p>
          </div>
        </div>
      </div>
    </section>

    <!-- ========== 小分队详情页 ========== -->
    <section id="page-team-detail" class="page hidden">
      <div class="flex items-center gap-3 mb-6">
        <button class="back-btn" data-page="teams">←</button>
        <h1 id="teamDetailTitle" class="text-xl font-bold truncate">小分队名称</h1>
      </div>

      <div id="teamDetailContent">
        <!-- 由 JS 动态生成 -->
      </div>
    </section>

    <!-- AA 分摊计算器（占位） -->
    <section id="page-aa" class="page hidden">
      <div class="flex items-center gap-3 mb-6">
        <button class="back-btn md:hidden" data-page="home">←</button>
        <h1 class="text-2xl font-bold">💰 AA 分摊计算器</h1>
      </div>
      <div class="placeholder-card">
        <p class="text-gray-400 dark:text-gray-500 text-lg">功能开发中…</p>
        <p class="text-gray-400 dark:text-gray-500 text-sm mt-2">将支持：添加成员、记录消费、最优还款方案计算</p>
      </div>
    </section>

    <!-- 在线桌游（占位） -->
    <section id="page-game" class="page hidden">
      <div class="flex items-center gap-3 mb-6">
        <button class="back-btn md:hidden" data-page="home">←</button>
        <h1 class="text-2xl font-bold">🎲 在线桌游</h1>
      </div>
      <div class="placeholder-card">
        <p class="text-gray-400 dark:text-gray-500 text-lg">功能开发中…</p>
        <p class="text-gray-400 dark:text-gray-500 text-sm mt-2">将支持：谁是卧底、你画我猜等旅途桌游</p>
      </div>
    </section>

    <!-- ========== 个人中心页 ========== -->
    <section id="page-profile" class="page hidden">
      <div class="flex items-center gap-3 mb-6">
        <button class="back-btn md:hidden" data-page="home">←</button>
        <h1 class="text-2xl font-bold">个人中心</h1>
      </div>

      <!-- 未登录 -->
      <div id="profileLoginPrompt" class="hidden">
        <div class="placeholder-card">
          <span class="text-5xl mb-4">👤</span>
          <p class="text-gray-500 dark:text-gray-400 text-lg font-medium">尚未登录</p>
          <button onclick="showLoginModal()" class="mt-4 px-6 py-2 rounded-lg bg-primary-600 hover:bg-primary-700 text-white font-medium transition-colors">
            登录
          </button>
        </div>
      </div>

      <!-- 已登录 -->
      <div id="profileContent" class="hidden">
        <!-- 用户信息卡片 -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 border border-gray-200 dark:border-gray-700 mb-6">
          <div class="flex items-center gap-4">
            <div id="profileAvatar" class="w-16 h-16 rounded-full flex items-center justify-center text-3xl bg-primary-100 dark:bg-primary-900/30">
              <!-- 由 JS 填充 -->
            </div>
            <div class="flex-1 min-w-0">
              <h2 id="profileNickname" class="text-lg font-bold truncate">用户昵称</h2>
              <p class="text-sm text-gray-500 dark:text-gray-400">用户</p>
            </div>
            <button onclick="showEditProfileModal()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" title="编辑资料">
              ✏️
            </button>
          </div>
        </div>

        <!-- 功能列表 -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 overflow-hidden">
          <button onclick="navigateTo('teams')" class="w-full flex items-center gap-3 px-4 py-3.5 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors border-b border-gray-100 dark:border-gray-700">
            <span class="text-xl">👥</span>
            <span class="flex-1 text-left">我的小分队</span>
            <span class="text-gray-400">›</span>
          </button>
          <button onclick="navigateTo('aa')" class="w-full flex items-center gap-3 px-4 py-3.5 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors border-b border-gray-100 dark:border-gray-700">
            <span class="text-xl">💰</span>
            <span class="flex-1 text-left">AA 记账</span>
            <span class="text-gray-400">›</span>
          </button>
          <button onclick="navigateTo('game')" class="w-full flex items-center gap-3 px-4 py-3.5 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors border-b border-gray-100 dark:border-gray-700">
            <span class="text-xl">🎲</span>
            <span class="flex-1 text-left">在线桌游</span>
            <span class="text-gray-400">›</span>
          </button>
          <button onclick="toggleTheme()" class="w-full flex items-center gap-3 px-4 py-3.5 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors">
            <span class="text-xl">🌓</span>
            <span class="flex-1 text-left">切换主题</span>
            <span class="text-gray-400">›</span>
          </button>
        </div>

        <!-- 退出登录 -->
        <button onclick="logout()" class="w-full mt-6 py-3 rounded-xl border border-red-300 dark:border-red-800 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 font-medium transition-colors">
          退出登录
        </button>
      </div>
    </section>

  </main>

  <!-- ========== 移动端底部 Tab 栏 ========== -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-t border-gray-200 dark:border-gray-700">
    <div class="flex justify-around py-2">
      <button class="tab-btn active" data-page="home">
        <span class="text-xl">🏠</span>
        <span class="text-xs">首页</span>
      </button>
      <button class="tab-btn" data-page="teams">
        <span class="text-xl">👥</span>
        <span class="text-xs">小分队</span>
      </button>
      <button class="tab-btn" data-page="aa">
        <span class="text-xl">💰</span>
        <span class="text-xs">记账</span>
      </button>
      <button class="tab-btn" data-page="game">
        <span class="text-xl">🎲</span>
        <span class="text-xs">桌游</span>
      </button>
      <button class="tab-btn" data-page="profile">
        <span class="text-xl">👤</span>
        <span class="text-xs">我的</span>
      </button>
    </div>
  </div>

  <!-- 底部安全间距（为移动端 tab 栏留空） -->
  <div class="h-16 md:h-0"></div>

  <script src="app.js"></script>
</body>
</html>
